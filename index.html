<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storm X - Open Directory Search</title>
    <meta name="description" content="Find direct download links for TV Series, Movies, Books, music, software, games and more.">
    <meta name="keywords" content="download, movies, games, music, software, epub, ebooks, pdf, mp3, songs, direct download">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a4a 0%, #0d1b2a 100%);
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.4286;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Mica Effect Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSgzMCkiPjxyZWN0IHdpZHRoPSIyIiBoZWlnaHQ9IjIiIGZpbGw9IiMwMDMzNjYiIG9wYWNpdHk9IjAuMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNwYXR0ZXJuKSIvPjwvc3ZnPg==');
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
        }
        
        header {
            padding: 40px 0 20px;
            text-align: center;
        }
        
        .logo-container {
            margin-bottom: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4a9eff 0%, #0066cc 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .logo-icon::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }
        
        .logo-icon::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            border-top-color: transparent;
            transform: rotate(-45deg);
        }
        
        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9eff 0%, #a2d2ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(74, 158, 255, 0.3);
        }
        
        .tagline {
            font-size: 18px;
            color: #b0c4de;
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .search-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .search-form {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-box {
            width: 100%;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 0 25px;
            font-size: 16px;
            outline: none;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .search-box:hover, .search-box:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .search-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #4a9eff 0%, #0066cc 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            padding: 0 24px;
            height: 42px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.3);
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4);
        }
        
        .dropdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #e0e0e0;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .dropdown-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background: rgba(30, 40, 60, 0.9);
            min-width: 180px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            z-index: 1;
            margin-top: 8px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .dropdown-content a {
            color: #e0e0e0;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .dropdown-content a:hover {
            background: rgba(74, 158, 255, 0.2);
            color: #ffffff;
        }
        
        .dropdown:hover .dropdown-content {
            display: block;
        }
        
        .footer {
            margin-top: auto;
            padding: 30px 20px;
            text-align: center;
            color: #8fa3c2;
            font-size: 13px;
        }
        
        .footer-links {
            margin-top: 15px;
        }
        
        .footer-links a {
            color: #a2d2ff;
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.2s ease;
        }
        
        .footer-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .logo-text {
                font-size: 36px;
            }
            
            .tagline {
                font-size: 16px;
            }
            
            .dropdown-container {
                flex-direction: column;
                align-items: center;
            }
            
            .logo {
                flex-direction: column;
                gap: 8px;
            }
            
            .logo-icon {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo">
                <div class="logo-icon"></div>
                <div class="logo-text">Storm X</div>
            </div>
        </div>
        <div class="tagline">Find direct download links for almost anything</div>
    </header>
    
    <main>
        <div class="search-container">
            <form class="search-form" id="searchForm" onsubmit="event.preventDefault(); startSearch();">
                <input type="hidden" name="fileType" value="" id="fileType">
                <input type="hidden" name="resType" value="" id="resType">
                <input type="hidden" name="engine" value="google" id="engine">
                
                <input type="text" name="query" value="" id="query" class="search-box" placeholder="Search for TV shows, movies, books, music, software...">
                
                <div class="search-buttons">
                    <button type="button" class="search-btn" onclick="startSearch()">Storm Search</button>
                </div>
                
                <div class="dropdown-container">
                    <div class="dropdown">
                        <button type="button" class="dropdown-btn" id="fileTypeBtn">
                            <span>All file types</span>
                            <span>▼</span>
                        </button>
                        <div class="dropdown-content" id="fileTypeDropdown">
                            <a href="#" onclick="setFiletype('mkv|mp4|avi|mov|mpg|wmv|divx|mpeg', 'TV/Movies', 'video', 'film')">TV/Movies/Video</a>
                            <a href="#" onclick="setFiletype('MOBI|CBZ|CBR|CBC|CHM|EPUB|FB2|LIT|LRF|ODT|PDF|PRC|PDB|PML|RB|RTF|TCR|DOC|DOCX', 'Books', 'ebook', 'book')">Books</a>
                            <a href="#" onclick="setFiletype('mp3|wav|ac3|ogg|flac|wma|m4a|aac|mod', 'Music', 'audio', 'music')">Music</a>
                            <a href="#" onclick="setFiletype('exe|iso|dmg|tar|7z|bz2|gz|rar|zip|apk', 'Software/ISO/DMG/Games', 'archive', 'cd')">Software/ISO/DMG/Games</a>
                            <a href="#" onclick="setFiletype('jpg|png|bmp|gif|tif|tiff|psd', 'Images', 'picture', 'picture')">Images</a>
                            <a href="#" onclick="setFiletype('-1', 'Other', 'all', 'asterisk')">Other</a>
                        </div>
                    </div>
                    
                    <div class="dropdown">
                        <button type="button" class="dropdown-btn" id="engineBtn">
                            <span>Google</span>
                            <span>▼</span>
                        </button>
                        <div class="dropdown-content" id="engineDropdown">
                            <a href="#" onclick="setEngine('google')">Google</a>
                            <a href="#" onclick="setEngine('googol')">Googol</a>
                            <a href="#" onclick="setEngine('startpage')">Startpage</a>
                            <a href="#" onclick="setEngine('searx')">Searx</a>
                            <a href="#" onclick="setEngine('filepursuit')">FilePursuit</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
    
    <footer class="footer">
        <div>Storm X - Find direct download links</div>
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Help</a>
        </div>
    </footer>

    <script>
        // Initialize default values
        document.addEventListener('DOMContentLoaded', function() {
            setFiletype('-1', 'Other', 'all', 'asterisk');
            setEngine('google');
        });
        
        // File type dropdown functionality
        function setFiletype(fileType, buttonData, resType, glyph) {
            var defaultString = 'Search anything';
            if (fileType==-1) {
                fileType="";
            }
            
            // Update placeholder based on file type
            switch(glyph) {
                case 'film':
                    document.getElementById('query').placeholder = defaultString+' eg. The.Blacklist.S01';
                    break;
                case 'music':
                    document.getElementById('query').placeholder = defaultString+' eg. K.Flay discography';
                    break;
                case 'book':
                    document.getElementById('query').placeholder = defaultString+' eg. 1985';
                    break;
                case 'cd':
                    document.getElementById('query').placeholder = defaultString+' eg. GTA V';
                    break;
                case 'picture':
                    document.getElementById('query').placeholder = defaultString+' eg. Donald Trump';
                    break;
                case 'asterisk':
                    document.getElementById('query').placeholder = defaultString;
                    break;
            }
            
            document.getElementById('fileType').value = fileType;
            document.getElementById('resType').value = resType;
            document.getElementById('fileTypeBtn').innerHTML = '<span>' + buttonData + '</span><span>▼</span>';
            document.getElementById('query').focus();
        }
        
        // Search engine dropdown functionality
        function setEngine(engine) {
            document.getElementById('engine').value = engine;
            document.getElementById('engineBtn').innerHTML = '<span>' + engine.charAt(0).toUpperCase() + engine.slice(1) + '</span><span>▼</span>';
            document.getElementById('query').focus();
        }
        
        // Search function
        function startSearch() {
            var query = document.getElementById('query').value;
            var fileType = document.getElementById('fileType').value;
            var resType = document.getElementById('resType').value;
            var engine = document.getElementById('engine').value;
            
            if (!query.trim()) {
                alert('Please enter a search query');
                return;
            }
            
            if (fileType=="") {
                if(engine=="filepursuit") {
                    fileType = "all";
                }
                var finalQuery = query+" -inurl:(jsp|pl|php|html|aspx|htm|cf|shtml) intitle:index.of -inurl:(listen77|mp3raid|mp3toss|mp3drug|index_of|index-of|wallywashis|downloadmana)";
            } else {
                var finalQuery = query+" +("+fileType+") -inurl:(jsp|pl|php|html|aspx|htm|cf|shtml) intitle:index.of -inurl:(listen77|mp3raid|mp3toss|mp3drug|index_of|index-of|wallywashis|downloadmana)";
            }
            
            var url;
            switch(engine) {
                case 'google':
                    url = "https://www.google.com/search?q="+encodeURIComponent(finalQuery);
                    break;
                case 'googol':
                    url = "https://googol.warriordudimanche.net/?q="+encodeURIComponent(finalQuery);
                    break;
                case 'startpage':
                    url = "https://www.startpage.com/do/dsearch?query="+encodeURIComponent(finalQuery);
                    break;
                case 'searx':
                    url = "https://searx.me/?q="+encodeURIComponent(finalQuery);
                    break;
                case 'filepursuit':
                    url = "https://filepursuit.com/search/"+query.replace(/ /g,"+")+"/type/"+resType;
                    break;
            }
            
            window.open(url, '_blank');
        }
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.style.display === 'block') {
                        openDropdown.style.display = 'none';
                    }
                }
            }
        });
    </script>
</body>
</html>
